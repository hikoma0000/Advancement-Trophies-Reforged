name: Suggestion
description: Suggest a new feature for the project.
title: "[Suggestion]: "
labels: ["type/suggestion", "status/not-yet-confirmed"]
body:
  - type: textarea
    id: suggestion
    attributes:
      label: What is your suggestion?
      description: "A clear and concise description of the feature you are suggesting."
      placeholder: "Describe your suggestion here."
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Why should this be added?
      description: "A clear and concise description of why you think this feature should be added."
      placeholder: "Describe the reason here."
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: "Add any other context or screenshots about the suggestion here."
      placeholder: "Add any other context here."
