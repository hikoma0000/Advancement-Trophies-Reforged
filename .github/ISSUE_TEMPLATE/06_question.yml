name: "Question"
description: "Ask a question about the project."
title: "[Question]: "
labels: ["type/question", "status/not-yet-confirmed"]
body:
  - type: textarea
    id: question
    attributes:
      label: Question
      description: "Please provide a clear and detailed description of your question."
      placeholder: "What is your question?"
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: "Add any other context or screenshots about your question here."
      placeholder: "Add any other context here."
