name: Improvement
description: Suggest an improvement for an existing feature.
title: "[Improvement]: "
labels: ["type/improvement", "status/not-yet-confirmed"]
body:
  - type: textarea
    id: improvement
    attributes:
      label: What would you like to improve?
      description: "A clear and concise description of what you want to be improved."
      placeholder: "Describe the improvement here."
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Why should this be improved?
      description: "A clear and concise description of why you think this improvement is needed."
      placeholder: "Describe the reason here."
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: "Add any other context or screenshots about the improvement here."
      placeholder: "Add any other context here."
